<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mawarith</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Noto+Sans+Bengali:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f8f4;--bg2:#d9efe3;--card:#ffffff;--card2:#f6fbf8;--ink:#12362e;--muted:#58756c;
  --brand:#0e8f70;--brand2:#14c299;--gold:#f5b72e;--gold2:#ffe08a;--rose:#ff6f8e;--sky:#4aa8ff;
  --line:#d5e6dc;--danger:#e0484f;--shadow:0 12px 30px rgba(14,100,80,.14);--glow:0 0 0 4px rgba(20,194,153,.28);
  --r:24px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b1b18;--bg2:#10332c;--card:#13272a;--card2:#183034;--ink:#e8f6f0;--muted:#98b8ae;--line:#254540;
    --shadow:0 12px 30px rgba(0,0,0,.45);--glow:0 0 0 4px rgba(20,194,153,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0b1b18;--bg2:#10332c;--card:#13272a;--card2:#183034;--ink:#e8f6f0;--muted:#98b8ae;--line:#254540;
  --shadow:0 12px 30px rgba(0,0,0,.45);--glow:0 0 0 4px rgba(20,194,153,.35);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;color:var(--ink);font-family:'Cairo','Noto Sans Bengali',system-ui,'Segoe UI',Tahoma,Arial,sans-serif;line-height:1.6;
  background:radial-gradient(1100px 560px at 100% -10%,var(--bg2),transparent 62%),radial-gradient(900px 520px at 0% 110%,rgba(245,183,46,.2),transparent 60%),var(--bg);
  background-attachment:fixed;
}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}
svg{display:block}

/* ============ عام ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.btn{border:0;cursor:pointer;font-weight:800;border-radius:16px;padding:12px 20px;transition:transform .18s,box-shadow .18s,opacity .18s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.tab:focus-visible,.pk:focus-visible,.stepper button:focus-visible,.ic:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 8px 20px rgba(14,143,112,.35)}
.btn.gold{background:linear-gradient(135deg,var(--gold),#ff9d2e);color:#3a2500;box-shadow:0 10px 24px rgba(255,157,46,.42)}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.big{font-size:1.3rem;padding:16px 30px;border-radius:22px}
.btn[disabled]{opacity:.6;cursor:wait}
.field{margin:0 0 14px}
.field label{display:block;font-weight:800;margin-bottom:6px}
.field small{color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=number],select{
  width:100%;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card2);outline:none;transition:border-color .2s,box-shadow .2s
}
input:focus,select:focus{border-color:var(--brand2);box-shadow:var(--glow)}
.err{color:var(--danger);font-weight:700;min-height:1.4em;margin:6px 0}
h1,h2,h3,h4{margin:0}
.ic{width:42px;height:42px;border-radius:14px;border:2px solid var(--line);background:var(--card);cursor:pointer;font-size:1.15rem;display:grid;place-items:center;transition:transform .15s}
.ic:hover{transform:translateY(-2px)}

/* ============ تسجيل الدخول ============ */
.screen{min-height:100vh;display:grid;place-items:center;padding:20px 14px;position:relative;overflow:hidden}
.login-wrap{width:100%;max-width:440px;position:relative;z-index:1}
.deco{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.deco i{position:absolute;font-style:normal;opacity:.7;animation:float 7s ease-in-out infinite}
.brand{text-align:center;margin-bottom:6px}
.brand .mascot{width:120px;margin:0 auto;animation:bob 2.4s ease-in-out infinite}
.brand h1{font-size:2.6rem;font-weight:900;letter-spacing:0;background:linear-gradient(135deg,var(--brand),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.3}
.brand p{margin:0;color:var(--muted);font-weight:600}
.fam{display:flex;justify-content:center;align-items:flex-end;margin:8px 0 -26px;position:relative;z-index:2}
.fam .av{width:78px;margin:0 -9px;animation:bob 2.2s ease-in-out infinite}
.fam .av:nth-child(2n){animation-delay:.35s}.fam .av:nth-child(3n){animation-delay:.7s}
.login-card{padding-top:40px}
.tabs{display:flex;gap:6px;background:var(--card2);border:1px solid var(--line);padding:5px;border-radius:18px;margin-bottom:16px}
.tab{flex:1;border:0;background:transparent;padding:10px;border-radius:14px;cursor:pointer;font-weight:800;color:var(--muted);transition:.2s}
.tab.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 6px 14px rgba(14,143,112,.3)}
.pw{position:relative}
.pw .eye{position:absolute;inset-inline-start:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;cursor:pointer;font-size:1.2rem}
.pw input{padding-inline-start:46px}
.swap{background:none;border:0;color:var(--brand);font-weight:800;cursor:pointer;text-decoration:underline;padding:6px}
.chip{display:inline-block;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#3a2500;font-weight:900;padding:6px 14px;border-radius:999px;cursor:pointer;letter-spacing:1px;direction:ltr}
.note{color:var(--muted);font-size:.9rem;text-align:center;margin:12px 0 0}

/* ============ الملف الشخصي ============ */
.profile{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;
  padding:10px 14px;margin:10px auto 0;max-width:980px;
  background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)
}
.pf-av{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--brand2),var(--gold));display:grid;place-items:center;color:#fff;font-weight:900;font-size:1.5rem;flex:none;box-shadow:0 4px 12px rgba(14,143,112,.35)}
.pf-info{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.pf-tag{font-size:.78rem;color:var(--brand);font-weight:800}
.pf-info b{font-size:1.08rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-info span.mail{color:var(--muted);font-size:.88rem;direction:ltr;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-actions{display:flex;gap:6px;flex:none}
.wrap{max-width:980px;margin:0 auto;padding:16px 14px 60px}

/* ============ الرئيسية ============ */
.hero{position:relative;overflow:hidden;border-radius:30px;box-shadow:var(--shadow);min-height:300px;color:#fff;background:#0a5c4a}
.hero svg.scene{position:absolute;inset:0;width:100%;height:100%}
.hero .in{position:relative;z-index:2;padding:30px 22px 26px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;max-width:560px}
.hero h2{font-size:clamp(1.9rem,6vw,2.9rem);font-weight:900;line-height:1.25;text-shadow:0 3px 14px rgba(0,0,0,.3)}
.hero p{margin:0;font-weight:600;font-size:1.08rem;opacity:.96;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.hero .mini{position:absolute;z-index:2;inset-inline-end:14px;bottom:0;width:150px;animation:bob 2.6s ease-in-out infinite}
.pulse{animation:pulse 2.2s ease-in-out infinite}
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:18px}
.feat{display:flex;gap:12px;align-items:flex-start}
.feat .ico{font-size:2rem;flex:none;line-height:1}
.feat h4{font-size:1.05rem}
.feat p{margin:2px 0 0;color:var(--muted);font-size:.93rem}
.ayah{margin-top:18px;text-align:center;background:linear-gradient(135deg,rgba(245,183,46,.18),rgba(20,194,153,.14));border-style:dashed}
.ayah q{font-size:1.25rem;font-weight:800;quotes:"﴿" "﴾";color:var(--brand)}
.ayah small{display:block;color:var(--muted);margin-top:2px}

/* ============ المعالج ============ */
.steps{list-style:none;display:flex;gap:8px;margin:0 0 16px;padding:0}
.steps li{flex:1;text-align:center;padding:10px 4px;border-radius:16px;background:var(--card);border:2px solid var(--line);font-weight:800;color:var(--muted);transition:.25s;font-size:.95rem}
.steps li.on{background:linear-gradient(135deg,var(--brand),var(--brand2));border-color:transparent;color:#fff;box-shadow:0 8px 18px rgba(14,143,112,.3)}
.steps li.done{border-color:var(--brand2);color:var(--brand)}
.step h2{font-size:1.5rem;margin-bottom:12px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.pk{border:3px solid var(--line);background:var(--card);border-radius:26px;padding:10px 8px 14px;cursor:pointer;text-align:center;transition:.22s}
.pk .av{width:120px;margin:0 auto}
.pk b{display:block;font-size:1.15rem;margin-top:4px}
.pk small{color:var(--muted)}
.pk.on{border-color:var(--brand2);box-shadow:var(--glow);background:linear-gradient(180deg,var(--card),rgba(20,194,153,.1));transform:translateY(-3px)}
.money-in{display:grid;grid-template-columns:1fr 130px;gap:8px}
.money-in input{font-size:1.5rem;font-weight:900;direction:ltr;text-align:center}
.grp{margin:22px 0 10px;font-size:1.15rem;display:flex;align-items:center;gap:8px}
.heirs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.hc{position:relative;background:var(--card);border:3px solid var(--line);border-radius:28px;padding:10px 8px 14px;text-align:center;transition:.25s}
.hc .av{width:116px;margin:0 auto}
.hc h4{font-size:1rem;line-height:1.35;min-height:2.7em;display:flex;align-items:center;justify-content:center}
.hc small{display:block;color:var(--muted);font-size:.8rem;margin-top:-2px}
.hc.on{border-color:var(--brand2);box-shadow:var(--glow);background:linear-gradient(180deg,var(--card),rgba(20,194,153,.1));transform:translateY(-3px)}
.hc.on .av{animation:bob 1.7s ease-in-out infinite}
.hc.on::after{content:"✓";position:absolute;top:8px;inset-inline-start:8px;width:28px;height:28px;border-radius:50%;background:var(--brand2);color:#fff;font-weight:900;display:grid;place-items:center;animation:pop .3s}
.stepper{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px}
.stepper button{width:40px;height:40px;border-radius:50%;border:0;font-size:1.5rem;font-weight:900;cursor:pointer;background:var(--brand);color:#fff;line-height:1;transition:transform .15s}
.stepper button:active{transform:scale(.88)}
.stepper button.minus{background:var(--line);color:var(--ink)}
.stepper .num{min-width:32px;font-size:1.5rem;font-weight:900;direction:ltr}
.bar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));margin-top:18px;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:20px;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);box-shadow:var(--shadow)}
.bar b{color:var(--brand)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.sw{position:relative;display:inline-block;width:56px;height:32px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.25s;cursor:pointer}
.sw span::before{content:"";position:absolute;width:24px;height:24px;top:4px;inset-inline-start:4px;border-radius:50%;background:#fff;transition:.25s;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.sw input:checked+span{background:linear-gradient(135deg,var(--brand),var(--brand2))}
.sw input:checked+span::before{inset-inline-start:28px}
.sw input:focus-visible+span{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{margin-top:12px;padding:14px;border-radius:18px;background:var(--card2);border:1px dashed var(--line)}
.chk{display:flex;gap:10px;align-items:flex-start;margin:8px 0;cursor:pointer}
.chk input{width:20px;height:20px;margin-top:4px;accent-color:var(--brand)}
details{margin-top:14px}
summary{cursor:pointer;font-weight:800;color:var(--brand)}
.sumline{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.sumline span{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.92rem}

/* ============ النتيجة ============ */
.banner{position:relative;overflow:hidden;text-align:center;background:linear-gradient(135deg,#0c6e57,#14c299);color:#fff;border:0;padding:22px 16px 18px}
.banner h2{font-size:clamp(1.5rem,5vw,2.2rem);font-weight:900}
.banner p{margin:4px 0 0;font-weight:600;opacity:.95}
.banner .mascot{width:132px;margin:0 auto;animation:bob 2s ease-in-out infinite}
.banner .gift{position:absolute;bottom:6px;width:70px;animation:bob 2.4s ease-in-out infinite}
.banner .gift.l{inset-inline-start:12px}.banner .gift.r{inset-inline-end:12px;animation-delay:.6s}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.tile{padding:14px;text-align:center}
.tile small{color:var(--muted);font-weight:700}
.tile b{display:block;font-size:1.25rem;direction:ltr;overflow-wrap:anywhere}
.tile.hl{background:linear-gradient(135deg,var(--gold2),var(--gold));border:0;color:#3a2500}
.tile.hl small{color:#5b3d00}
.donut{display:grid;grid-template-columns:230px 1fr;gap:18px;align-items:center}
.donut svg{width:100%;max-width:230px;margin:auto}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.legend li{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.95rem}
.legend i{width:14px;height:14px;border-radius:5px;flex:none}
.legend em{margin-inline-start:auto;font-style:normal;color:var(--muted);direction:ltr}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.rcard{display:flex;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:26px;padding:12px;box-shadow:var(--shadow);animation:rise .5s both}
.rcard .rav{width:96px;flex:none}
.rcard .rb{flex:1;min-width:0}
.rcard h4{font-size:1.08rem}
.cnt{background:var(--gold);color:#3a2500;border-radius:999px;padding:0 9px;font-size:.88rem;margin-inline-start:6px}
.rf{display:flex;align-items:center;gap:10px;margin:2px 0}
.pct{background:rgba(20,194,153,.15);color:var(--brand);font-weight:900;border-radius:999px;padding:1px 10px;font-size:.9rem;direction:ltr}
.amt{font-size:1.35rem;font-weight:900;color:var(--brand);direction:ltr;text-align:start;overflow-wrap:anywhere}
.per{font-size:.9rem;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.why{margin:6px 0 0;padding:0;padding-inline-start:16px;color:var(--muted);font-size:.86rem}
.rcard.off{opacity:.72;filter:grayscale(.7)}
.rcard.off .rav{filter:grayscale(1)}
.zero{display:inline-block;background:var(--line);border-radius:999px;padding:1px 12px;font-weight:800;font-size:.9rem}
.fr{display:inline-flex;flex-direction:column;align-items:center;font-weight:900;line-height:1.05;direction:ltr;font-size:1.1rem}
.fr b{padding:0 4px}.fr b:first-child{border-bottom:2.5px solid currentColor}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px;text-align:center}
th,td{padding:9px 8px;border-bottom:1px solid var(--line)}
th{background:var(--card2);font-weight:800;white-space:nowrap}
td:first-child,th:first-child{text-align:start}
td.n{direction:ltr}
tfoot td{font-weight:900;background:var(--card2)}
.notes ul{margin:8px 0 0;padding:0;padding-inline-start:20px;color:var(--muted)}
.notes li{margin:4px 0}
.ok{display:flex;gap:8px;align-items:center;font-weight:800;color:var(--brand)}
.famphoto{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:2px;padding:10px 0 0;background:linear-gradient(180deg,transparent,rgba(20,194,153,.12));border-radius:20px}
.famphoto .m{position:relative;width:84px;animation:bob 2.1s ease-in-out infinite}
.famphoto .m span{position:absolute;top:-4px;inset-inline-end:0;background:var(--gold);color:#3a2500;font-weight:900;border-radius:999px;font-size:.78rem;padding:0 7px}
.famphoto .m.d{width:110px}
.sec{margin:22px 0 10px;font-size:1.3rem;display:flex;align-items:center;gap:8px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;justify-content:center}

/* ============ طبقات ============ */
.overlay{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#0e8f70,#07372d);color:#fff;text-align:center;padding:20px}
.overlay .mascot{width:170px;margin:0 auto;animation:jump .7s ease-in-out infinite}
.overlay h3{font-size:1.5rem;margin:8px 0 14px;min-height:2em}
.prog{width:min(320px,80vw);height:12px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden;margin:0 auto}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#fff);border-radius:99px;transition:width 1.6s ease-out}
#toast{position:fixed;inset-inline:0;bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:200;pointer-events:none}
#toast div{background:#12362e;color:#fff;padding:12px 20px;border-radius:16px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:rise .3s both;max-width:90vw;text-align:center}
.modal{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:16px}
.modal .card{width:100%;max-width:400px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:300}

.assets{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;margin-bottom:16px}
.asset{background:var(--card);border:3px solid var(--line);border-radius:28px;padding:12px;transition:.25s}
.asset.on{border-color:var(--brand2);box-shadow:var(--glow);background:linear-gradient(180deg,var(--card),rgba(20,194,153,.08))}
.ahead{display:flex;align-items:center;gap:10px}
.aimg{width:116px;flex:none}
.aimg svg{width:100%;height:auto}
.asset:not(.on) .aimg{filter:grayscale(.85);opacity:.7}
.asset.on .aimg{animation:bob 2.2s ease-in-out infinite}
.atit{flex:1;display:flex;flex-direction:column;line-height:1.3;min-width:0}
.atit b{font-size:1.15rem}
.atit small{color:var(--muted)}
.afields{display:none;margin-top:10px}
.asset.on .afields{display:block}
.asset .field{margin-bottom:10px}
.ibox{display:flex;gap:8px}
.ibox input{direction:ltr;text-align:center;font-weight:900;font-size:1.2rem}
.unit{align-self:center;font-weight:900;color:var(--brand);background:rgba(20,194,153,.15);border-radius:12px;padding:10px 12px;white-space:nowrap}
.astiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0 0}
.at{text-align:center;padding:10px}
.at small{color:var(--muted);font-weight:700}
.aimg.sm{width:84px;margin:0 auto}
.at b{display:block;direction:ltr;font-size:1.1rem}
.parts{list-style:none;margin:6px 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.parts li{display:flex;gap:4px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.92rem}
.parts b{direction:ltr}
td.n div{white-space:nowrap}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-18px) rotate(8deg)}}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 10px 24px rgba(255,157,46,.42)}50%{transform:scale(1.05);box-shadow:0 14px 34px rgba(255,157,46,.7)}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes jump{0%,100%{transform:translateY(0) scale(1,1)}40%{transform:translateY(-28px) scale(.97,1.04)}80%{transform:translateY(0) scale(1.05,.95)}}
@media (max-width:640px){
  .donut{grid-template-columns:1fr}
  .hero .mini{width:96px}
  .pf-actions .ic{width:38px;height:38px}
  .rgrid{grid-template-columns:1fr}
  .money-in{grid-template-columns:1fr 112px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media print{
  .profile,.actions,.nav,#overlay,#confetti,.deco{display:none!important}
  body{background:#fff}.card,.rcard{box-shadow:none}
}

/* ===== شاشة اختيار اللغة ===== */
#langScreen{grid-template-columns:minmax(0,1fr)}
.lsw{width:100%;min-width:0;max-width:780px;margin:0 auto;position:relative;z-index:1;text-align:center}
.lsw .mascot{width:128px;margin:0 auto;animation:bob 2.4s ease-in-out infinite}
.lsw h1{font-size:3.4rem;font-weight:900;line-height:1.2;background:linear-gradient(135deg,var(--brand),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.lsw .names{color:var(--muted);font-weight:700;font-size:.92rem;overflow-wrap:anywhere}
.lsw .ask{font-size:1.3rem;font-weight:900;margin:16px 0 14px;overflow-wrap:anywhere}
.lgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:640px){.lgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.lcard{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:22px;border:2px solid var(--line);background:var(--card);box-shadow:var(--shadow);cursor:pointer;text-align:start;transition:transform .2s,border-color .2s;animation:rise .5s both;color:var(--ink)}
.lcard:hover{transform:translateY(-4px);border-color:var(--brand2)}
.lcard:active{transform:scale(.97)}
.lcard:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.lcard .lb{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;font-size:1rem;flex:none;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 6px 14px rgba(0,0,0,.2)}
.lcard b{display:block;font-size:.98rem;line-height:1.25;overflow-wrap:break-word}
@media(max-width:430px){.lcard{padding:10px;gap:9px}.lcard .lb{width:40px;height:40px;font-size:.85rem}.lcard b{font-size:.92rem}}
.lcard small{color:var(--muted);font-weight:700}
.lcard.sug,.lcard.on{border-color:var(--gold);box-shadow:0 0 0 4px rgba(245,183,46,.3),var(--shadow)}
#langSheet .lgrid{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:12px}
.pf-info .tl{color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modal .card{max-height:88vh;overflow:auto}
.banner{padding-bottom:108px}

/* ===== أزرار الأعلى والمحفوظات ===== */
.pill{height:42px;padding:0 12px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:800;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;max-width:150px;transition:transform .15s}
.pill:hover{transform:translateY(-2px)}
.pill span{overflow:hidden;text-overflow:ellipsis}
.ic{position:relative}
.bdg{position:absolute;top:-7px;inset-inline-end:-7px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--rose);color:#fff;font-size:.72rem;font-weight:900;display:grid;place-items:center;border:2px solid var(--card)}
@media(max-width:520px){.pf-info .tl{display:none}.pf-actions{gap:6px}.pill{max-width:118px;padding:0 9px}}
.hitem{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px;border:2px solid var(--line);border-radius:18px;background:var(--card2);margin-top:10px}
.hmain{min-width:0;display:flex;flex-direction:column;gap:2px}
.hmain b{overflow-wrap:anywhere;unicode-bidi:plaintext;text-align:start}
.hmain small{color:var(--muted);font-weight:700}
.hbtns{display:flex;gap:6px;flex:none}
.btn.sm{padding:8px 12px;font-size:.9rem;border-radius:12px}
.btn.del.armed{background:var(--danger);color:#fff;border-color:transparent}
.hempty{text-align:center;color:var(--muted);font-weight:700;padding:22px 8px;font-size:1.05rem}
.histnote{text-align:center;color:var(--muted);font-weight:700;margin-top:20px}
</style>
</head>
<body>

<!-- ===================== شاشة الدخول ===================== -->
<main id="langScreen" class="screen">
  <div class="deco" aria-hidden="true">
    <i style="top:5%;inset-inline-start:7%;font-size:2.2rem">🌙</i>
    <i style="top:12%;inset-inline-end:9%;font-size:1.6rem;animation-delay:1s">⭐</i>
    <i style="top:46%;inset-inline-start:3%;font-size:1.8rem;animation-delay:2s">✨</i>
    <i style="bottom:10%;inset-inline-end:5%;font-size:2.2rem;animation-delay:.5s">💰</i>
    <i style="bottom:7%;inset-inline-start:10%;font-size:1.7rem;animation-delay:1.5s">⚖️</i>
    <i style="top:30%;inset-inline-end:3%;font-size:1.5rem;animation-delay:2.5s">🏠</i>
  </div>
  <div class="lsw">
    <div class="mascot" id="lsMascot"></div>
    <h1>مواريث</h1>
    <div class="names">Mawarith · میراث · Miras · Warisan · মীরাস · Мирас</div>
    <div class="ask">اختر لغتك &nbsp;·&nbsp; Choose your language</div>
    <div class="lgrid" id="lsGrid"></div>
  </div>
</main>

<!-- ===================== التطبيق ===================== -->
<div id="app" class="hidden">
  <header class="profile">
    <div class="pf-av" aria-hidden="true">⚖️</div>
    <div class="pf-info"><b data-i18n="brand"></b><span class="tl" data-i18n="tag"></span></div>
    <div class="pf-actions">
      <button class="pill" type="button" data-act="lang" data-aria="language" aria-label="language">🌐 <span id="langPillTxt"></span></button>
      <button class="ic" id="btnHist" type="button" data-aria="hist_btn" aria-label="saved">🗂️<span class="bdg hidden" id="histBadge">0</span></button>
      <button class="ic" id="btnTheme" type="button" data-aria="theme" aria-label="theme">🌓</button>
    </div>
  </header>

  <div class="wrap">
    <section id="home">
      <div class="hero">
        <svg class="scene" viewBox="0 0 600 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true" id="heroScene"></svg>
        <div class="in">
          <h2 data-i18n="hero_t"></h2>
          <p data-i18n="hero_d"></p>
          <button class="btn gold big pulse" id="btnStart" type="button"><span data-i18n="cta"></span> ✨</button>
        </div>
        <div class="mini" id="heroMini" aria-hidden="true"></div>
      </div>
      <div class="feats">
        <div class="card feat"><div class="ico">⚖️</div><div><h4 data-i18n="ch1"></h4><p data-i18n="f1d"></p></div></div>
        <div class="card feat"><div class="ico">📜</div><div><h4 data-i18n="ch2"></h4><p data-i18n="f2d"></p></div></div>
        <div class="card feat"><div class="ico">🎨</div><div><h4 data-i18n="ch3"></h4><p data-i18n="f3d"></p></div></div>
      </div>
      <div class="card ayah"><q>يُوصِيكُمُ اللَّهُ فِي أَوْلَادِكُمْ ۖ لِلذَّكَرِ مِثْلُ حَظِّ الْأُنثَيَيْنِ</q><small data-i18n="ayah_ref"></small></div>
    </section>

    <section id="wizard" class="hidden">
      <ol class="steps" id="stepsBar">
        <li>1 <span data-i18n="s2"></span></li><li>2 <span data-i18n="s3"></span></li><li>3 <span data-i18n="s4"></span></li>
      </ol>

      <div class="step" id="s1">
        <h2 data-i18n="q1"></h2>
        <div class="pick">
          <button class="pk on" type="button" data-sex="m"><div class="av" id="decM"></div><b data-i18n="male"></b><small data-i18n="rip_m"></small></button>
          <button class="pk" type="button" data-sex="f"><div class="av" id="decF"></div><b data-i18n="female"></b><small data-i18n="rip_f"></small></button>
        </div>
        <h3 class="grp" style="margin-top:6px"><span>🧺</span><span data-i18n="q2"></span></h3>
        <p style="margin:0 0 10px;color:var(--muted)" data-i18n="q2d"></p>
        <div class="field">
          <label for="cur" data-i18n="cur"></label>
          <select id="cur"></select>
        </div>
        <div class="assets">
          <div class="asset on" id="as-cash">
            <div class="ahead"><div class="aimg" id="img-cash"></div><div class="atit"><b data-i18n="cash"></b><small data-i18n="cash_d"></small></div><label class="sw"><input type="checkbox" id="onCash" checked aria-label="cash"><span></span></label></div>
            <div class="afields">
              <div class="field"><label for="estate" data-i18n="amount"></label><input id="estate" type="text" inputmode="decimal" autocomplete="off" dir="ltr" placeholder="1,000,000"><small id="estatePrev"></small></div>
            </div>
          </div>
          <div class="asset" id="as-house">
            <div class="ahead"><div class="aimg" id="img-house"></div><div class="atit"><b data-i18n="house"></b><small data-i18n="house_d"></small></div><label class="sw"><input type="checkbox" id="onHouse" aria-label="property"><span></span></label></div>
            <div class="afields">
              <div class="field"><label for="houseArea" data-i18n="area"></label><div class="ibox"><input id="houseArea" type="text" inputmode="decimal" autocomplete="off" dir="ltr" placeholder="250"><span class="unit" data-i18n="u_m2"></span></div></div>
              <div class="field"><label for="houseVal" data-i18n="val_opt"></label><input id="houseVal" type="text" inputmode="decimal" autocomplete="off" dir="ltr" placeholder="0"><small data-i18n="val_hint"></small></div>
            </div>
          </div>
          <div class="asset" id="as-land">
            <div class="ahead"><div class="aimg" id="img-land"></div><div class="atit"><b data-i18n="land"></b><small data-i18n="land_d"></small></div><label class="sw"><input type="checkbox" id="onLand" aria-label="land"><span></span></label></div>
            <div class="afields">
              <div class="field"><label for="landArea" data-i18n="area"></label><div class="ibox"><input id="landArea" type="text" inputmode="decimal" autocomplete="off" dir="ltr" placeholder="600"><span class="unit" data-i18n="u_m2"></span></div></div>
              <div class="field"><label for="landVal" data-i18n="val_opt"></label><input id="landVal" type="text" inputmode="decimal" autocomplete="off" dir="ltr" placeholder="0"><small data-i18n="val_hint"></small></div>
            </div>
          </div>
          <div class="asset" id="as-gold">
            <div class="ahead"><div class="aimg" id="img-gold"></div><div class="atit"><b data-i18n="gold"></b><small data-i18n="gold_d"></small></div><label class="sw"><input type="checkbox" id="onGold" aria-label="gold"><span></span></label></div>
            <div class="afields">
              <div class="field"><label for="goldG" data-i18n="weight"></label><div class="ibox"><input id="goldG" type="text" inputmode="decimal" autocomplete="off" dir="ltr" placeholder="100"><span class="unit" data-i18n="u_g"></span></div></div>
              <div class="grid2">
                <div class="field"><label for="goldK" data-i18n="karat"></label><select id="goldK"><option value="24">24</option><option value="22">22</option><option value="21" selected>21</option><option value="18">18</option></select></div>
                <div class="field"><label for="goldPrice" data-i18n="price_g"></label><input id="goldPrice" type="text" inputmode="decimal" autocomplete="off" dir="ltr" placeholder="0"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="step hidden" id="s2">
        <h2 data-i18n="q3"></h2>
        <p style="margin:0;color:var(--muted)" data-i18n="q3d"></p>
        <div id="heirsWrap"></div>
        <div class="bar"><span><span data-i18n="picked"></span>: <b id="heirCount">0</b></span><span id="heirHint" style="color:var(--muted);font-size:.9rem"></span></div>
      </div>

      <div class="step hidden" id="s3">
        <h2 data-i18n="q4"></h2>
        <div class="card">
          <div class="grid2">
            <div class="field"><label for="funeral" data-i18n="funeral"></label><input id="funeral" type="text" inputmode="decimal" dir="ltr" placeholder="0"></div>
            <div class="field"><label for="debts" data-i18n="debts"></label><input id="debts" type="text" inputmode="decimal" dir="ltr" placeholder="0"></div>
          </div>
          <div class="row" style="margin-top:6px">
            <div><b data-i18n="will_q"></b><br><small style="color:var(--muted)" data-i18n="will_s"></small></div>
            <label class="sw"><input type="checkbox" id="wasOn" aria-label="will"><span></span></label>
          </div>
          <div class="box hidden" id="wasBox">
            <div class="field"><label for="wasTo" data-i18n="will_to"></label><input id="wasTo" type="text"></div>
            <div class="grid2">
              <div class="field"><label for="wasType" data-i18n="will_type"></label><select id="wasType"><option value="amt" data-i18n="w_amt"></option><option value="pct" data-i18n="w_pct"></option></select></div>
              <div class="field"><label for="wasVal" data-i18n="w_val"></label><input id="wasVal" type="text" inputmode="decimal" dir="ltr" placeholder="0"></div>
            </div>

          </details>
        </div>
        <div class="card" style="margin-top:14px">
          <b data-i18n="sum"></b>
          <div class="sumline" id="sumLine"></div>
        </div>
      </div>

      <div class="nav">
        <button class="btn ghost" id="btnBack" type="button" data-i18n="back"></button>
        <button class="btn primary" id="btnNext" type="button"></button>
      </div>
    </section>

    <section id="result" class="hidden"><div id="resBody"></div></section>
  </div>
</div>

<div id="overlay" class="overlay hidden" role="status" aria-live="polite">
  <div>
    <div class="mascot" id="loadMascot"></div>
    <h3 id="loadMsg"></h3>
    <div class="prog"><i id="loadBar"></i></div>
  </div>
</div>

<div id="langSheet" class="modal hidden">
  <div class="card" role="dialog">
    <div class="row"><h3 data-i18n="lang_t"></h3><button class="ic" id="langX" type="button" aria-label="close">✕</button></div>
    <div class="lgrid" id="langGrid"></div>
  </div>
</div>

<div id="histSheet" class="modal hidden">
  <div class="card" role="dialog">
    <div class="row"><h3 data-i18n="hist_t"></h3><button class="ic" id="histX" type="button" aria-label="close">✕</button></div>
    <div id="histList"></div>
    <div id="histFoot"></div>
  </div>
</div>

<script>

const mem={};
const store={
  get(k){try{const v=localStorage.getItem(k);return v==null?(k in mem?mem[k]:null):JSON.parse(v)}catch(e){return k in mem?mem[k]:null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v}},

  let x=String(s==null?'':s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[০-৯]/g,d=>'০১২৩৪৫৬৭৮৯'.indexOf(d)).replace(/٫/g,'.').replace(/\s/g,'');
  if(!/\./.test(x)&&/,\d{1,2}$/.test(x))x=x.replace(/,(\d{1,2})$/,'.$1');
  return x.replace(/[٬,]/g,'');
};
const num=s=>{const v=parseFloat(normNum(s));return isFinite(v)&&v>0?v:0};

const decCache={};
const decOf=c=>{if(c in decCache)return decCache[c];let d=2;try{d=new Intl.NumberFormat('en-US',{style:'currency',currency:c}).resolvedOptions().maximumFractionDigits}catch(e){}return decCache[c]=d};

/* ============ اللغات ============ */
const LANGS=[['ar','العربية','rtl'],['en','English','ltr'],['tr','Türkçe','ltr'],['ur','اردو','rtl'],['fa','فارسی','rtl'],['id','Bahasa Indonesia','ltr'],['ms','Bahasa Melayu','ltr'],['bn','বাংলা','ltr'],['fr','Français','ltr'],['ru','Русский','ltr'],['az','Azərbaycanca','ltr'],['uz','Oʻzbekcha','ltr'],['sw','Kiswahili','ltr'],['sq','Shqip','ltr']];
const S={user:null,lang:'ar',step:1,sex:'m',c:{}};
let LAST=null;
const t=(k,p)=>{let s=I18N[S.lang]&&I18N[S.lang][k];if(s==null)s=I18N.en[k];if(s==null)s=I18N.ar[k];if(s==null)s=k;return p?String(s).replace(/\{(\w+)\}/g,(m,a)=>p[a]!=null?p[a]:m):s};
const CURS=['QAR','SAR','AED','KWD','BHD','OMR','JOD','EGP','MAD','TND','DZD','IQD','LYD','SDG','YER','TRY','PKR','BDT','IDR','MYR','IRR','AFN','NGN','KZT','UZS','AZN','USD','EUR','GBP'];
function curName(c){try{return new Intl.DisplayNames([S.lang],{type:'currency'}).of(c)}catch(e){return c}}
function buildCurrencies(){
  const sel=$('#cur'),prev=sel.value||store.get('mirath_cur')||'QAR';
  sel.innerHTML=CURS.map(c=>`<option value="${c}">${c} — ${esc(curName(c))}</option>`).join('');
  sel.value=CURS.includes(prev)?prev:'QAR';
}

const I18N={};
I18N.ar={

profile:"الملف الشخصي",edit_p:"تعديل الملف",name:"الاسم",save:"حفظ",cancel:"إلغاء",logout:"خروج",saved:"تم الحفظ ✅",theme:"الوضع",language:"اللغة",lang_t:"اختر اللغة",
s1:"المتوفى",s2:"التركة",s3:"الورثة",s4:"الحقوق والوصية",q1:"من هو المتوفّى؟",male:"رجل",female:"امرأة",rip_m:"رحمه الله",rip_f:"رحمها الله",

const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const lcm=(a,b)=>a/gcd(a,b)*b;
class Fr{
  constructor(n,d=1){if(d<0){n=-n;d=-d}const g=gcd(n,d)||1;this.n=n/g;this.d=d/g}
  add(o){return new Fr(this.n*o.d+o.n*this.d,this.d*o.d)}
  sub(o){return new Fr(this.n*o.d-o.n*this.d,this.d*o.d)}
  mul(o){return new Fr(this.n*o.n,this.d*o.d)}
  div(o){return new Fr(this.n*o.d,this.d*o.n)}
  cmp(o){return this.n*o.d-o.n*this.d}
  num(){return this.n/this.d}
  toString(){return this.d===1?String(this.n):this.n+'/'+this.d}
}
const fr=(n,d=1)=>new Fr(n,d);
const ORDER=['husband','wife','father','mother','gf','gmM','gmP','son','daughter','gson','gdau','fbro','fsis','pbro','psis','ubro','usis','nephF','nephP','uncF','uncP','cousF','cousP'];

function compute(c,o){
  const Z=fr(0),ONE=fr(1);
  const E={};
  ORDER.forEach(k=>E[k]={count:c[k]||0,fard:Z,asaba:Z,why:[],blocked:null,total:Z});
  const meta={notes:[],awl:false,radd:false,rest:Z,asl:1,awlTo:0};
  const n=k=>E[k].count,has=k=>n(k)>0,live=k=>has(k)&&!E[k].blocked;
  const B=x=>({t:'blk',x});
  const setBlock=(k,w)=>{if(has(k)&&!E[k].blocked)E[k].blocked=w};
  const addFard=(k,f,cs)=>{E[k].fard=f;E[k].why.push({t:cs,f:f.toString()})};
  const addAsaba=(k,f,key)=>{E[k].asaba=E[k].asaba.add(f);if(key)E[k].why.push({t:key})};
  const note=(t,p)=>meta.notes.push({t,p:p||{}});
  const pos=f=>f.n<0?Z:f;
  const minF=(a,b)=>a.cmp(b)<=0?a:b;
  const zeroW=k=>E[k].why.push({t:'a_zero'});

  const maleDesc=has('son')||has('gson');
  const femDesc=!maleDesc&&(has('daughter')||has('gdau'));
  const anyDesc=maleDesc||femDesc;
  const father=has('father');
  const gfActive=has('gf')&&!father;
  const hs=has('husband'),wv=has('wife');
  const sibTotal=n('fbro')+n('fsis')+n('pbro')+n('psis')+n('ubro')+n('usis');
  const mdKey=has('son')?'son':'gson';

  /* الحجب */
  if(father)setBlock('gf',B('father'));
  if(has('son')){setBlock('gson',B('son'));setBlock('gdau',B('son'))}
  if(!has('son')&&!has('gson')&&n('daughter')>=2)setBlock('gdau',{t:'b_two_dau'});
  if(has('mother')){setBlock('gmM',B('mother'));setBlock('gmP',B('mother'))}
  if(father)setBlock('gmP',B('father'));
  const sibB=maleDesc?B(mdKey):father?B('father'):(o.hanafi&&gfActive?B('gf'):null);
  if(sibB)['fbro','fsis','pbro','psis'].forEach(k=>setBlock(k,sibB));
  const uB=anyDesc?B('desc'):father?B('father'):gfActive?B('gf'):null;
  if(uB)['ubro','usis'].forEach(k=>setBlock(k,uB));
  const farB=maleDesc?B(mdKey):father?B('father'):gfActive?B('gf'):null;
  const far=['nephF','nephP','uncF','uncP','cousF','cousP'];
  if(farB)far.forEach(k=>setBlock(k,farB));

  const sFB=live('fbro')?n('fbro'):0,sFS=live('fsis')?n('fsis'):0,sPB=live('pbro')?n('pbro'):0,sPS=live('psis')?n('psis'):0;
  if(sFB>0){setBlock('pbro',B('fbro'));setBlock('psis',B('fbro'))}
  if(femDesc&&sFS>0&&!gfActive&&!father){setBlock('pbro',B('fsis'));setBlock('psis',B('fsis'))}
  const pB=sFB>0?0:(live('pbro')?n('pbro'):0),pS=live('psis')?n('psis'):0;
  const sibActive=(sFB+sFS+sPB+sPS)>0;

  /* الفروض */
  let spouseF=Z;
  if(wv){spouseF=anyDesc?fr(1,8):fr(1,4);addFard('wife',spouseF,anyDesc?'c_desc':'c_nodesc')}
  if(hs){spouseF=anyDesc?fr(1,4):fr(1,2);addFard('husband',spouseF,anyDesc?'c_desc':'c_nodesc')}
  if(has('mother')){
    const umar=(hs||wv)&&father&&!anyDesc&&sibTotal<2;
    if(anyDesc)addFard('mother',fr(1,6),'c_desc');
    else if(sibTotal>=2)addFard('mother',fr(1,6),'c_sibs');
    else if(umar){addFard('mother',ONE.sub(spouseF).div(fr(3)),'c_umar');note('n_umar')}
    else addFard('mother',fr(1,3),'c_nodesc_nosibs');
  }
  if(father){
    if(maleDesc)addFard('father',fr(1,6),'c_maledesc');
    else if(femDesc)addFard('father',fr(1,6),'c_femdesc');
    else E.father.why.push({t:'a_take'});
  }
  if(gfActive&&!sibActive){
    if(maleDesc)addFard('gf',fr(1,6),'c_maledesc');
    else if(femDesc)addFard('gf',fr(1,6),'c_femdesc');
    else E.gf.why.push({t:'a_take'});
  }
  const gms=['gmM','gmP'].filter(live);
  gms.forEach(k=>addFard(k,fr(1,6).div(fr(gms.length)),gms.length>1?'c_gm2':'c_gm1'));
  if(has('daughter')&&!has('son')){
    if(n('daughter')===1)addFard('daughter',fr(1,2),'c_nomu');
    else addFard('daughter',fr(2,3),'c_pl_nomu');
  }
  if(live('gdau')&&!has('son')&&!has('gson')){
    if(!has('daughter'))addFard('gdau',n('gdau')===1?fr(1,2):fr(2,3),n('gdau')===1?'c_alone':'c_plural');
    else if(n('daughter')===1)addFard('gdau',fr(1,6),'c_complete');
  }
  const uL=(live('ubro')?n('ubro'):0)+(live('usis')?n('usis'):0);
  if(uL>0){
    const f=uL===1?fr(1,6):fr(1,3);
    ['ubro','usis'].forEach(k=>{if(live(k))addFard(k,f.mul(fr(n(k),uL)),uL===1?'c_alone':'c_uter_shared')});
  }
  if(!anyDesc&&!father&&!gfActive){
    if(sFB===0&&sFS>0)addFard('fsis',sFS===1?fr(1,2):fr(2,3),sFS===1?'c_alone':'c_plural');
    if(sFB===0&&sPB===0&&sPS>0){
      if(sFS===0)addFard('psis',sPS===1?fr(1,2):fr(2,3),sPS===1?'c_alone':'c_plural');
      else if(sFS===1)addFard('psis',fr(1,6),'c_complete');
      else setBlock('psis',{t:'b_two_fsis'});
    }
  }

  /* العصبات */
  const sumF=()=>ORDER.reduce((a,k)=>a.add(E[k].fard),Z);
  let res=ONE.sub(sumF());
  let claimed=false;
  const share=(list,r,key)=>{
    const act=list.filter(x=>live(x[0]));
    const tot=act.reduce((a,x)=>a+x[1]*n(x[0]),0);
    if(!tot)return;
    claimed=true;
    act.forEach(x=>{
      if(r.n>0)addAsaba(x[0],r.mul(fr(x[1]*n(x[0]),tot)),key);
      else zeroW(x[0]);
    });
  };

  if(has('son')){
    share([['son',2],['daughter',1]],res,'a_mf');
  }else if(has('gson')){
    share([['gson',2],['gdau',1]],res,'a_mf');
  }else if(father){
    claimed=true;
    if(res.n>0)addAsaba('father',res,'a_take');else zeroW('father');
  }else if(gfActive){
    if(!sibActive){
      claimed=true;
      if(res.n>0)addAsaba('gf',res,'a_take');else zeroW('gf');
    }else if(hs&&has('mother')&&n('gf')===1&&!anyDesc&&sFB===0&&sPB===0&&((sFS===1&&sPS===0)||(sPS===1&&sFS===0))&&!has('ubro')&&!has('usis')){
      claimed=true;
      const sis=sFS===1?'fsis':'psis';
      addFard('husband',fr(9,27),'akd');
      addFard('mother',fr(6,27),'akd');
      addFard('gf',fr(8,27),'akd');
      addFard(sis,fr(4,27),'akd');
      note('n_akd');
    }else{
      claimed=true;
      const R0=pos(res);
      const units=2*(sFB+sPB)+sFS+sPS;
      const muq=R0.mul(fr(2,2+units));
      const third=R0.div(fr(3));
      const sixth=fr(1,6);
      let best=muq,how='a_muq',isFard=false;
      if(third.cmp(best)>0){best=third;how='a_third'}
      if(sixth.cmp(best)>0){best=sixth;how='a_sixth_best';isFard=true}
      if(best.cmp(R0)>0){
        E.gf.fard=sixth;E.gf.why.push({t:'a_sixth_none'});
        ['fbro','fsis','pbro','psis'].forEach(k=>{if(live(k))zeroW(k)});
      }else{
        if(isFard){E.gf.fard=best;E.gf.why.push({t:how})}else addAsaba('gf',best,how);
        const rem=R0.sub(best);
        const capOf=cnt=>cnt===1?fr(1,2):fr(2,3);
        if(sFB>0){
          share([['fbro',2],['fsis',1]],rem,'a_muq');
          ['pbro','psis'].forEach(k=>{if(live(k))E[k].why.push({t:'a_muaadda'})});
        }else if(sFS>0){
          const cap=femDesc?rem:capOf(sFS);
          const take=minF(rem,cap);
          if(take.n>0)addAsaba('fsis',take,femDesc?'a_ghayr':'a_muq');
          const left=rem.sub(take);
          if(sPB+sPS>0)share([['pbro',2],['psis',1]],left,'a_mf');
          else if(left.n>0)addAsaba('gf',left,'a_leftover');
        }else if(sPB>0){
          share([['pbro',2],['psis',1]],rem,'a_muq');
        }else{
          const cap=femDesc?rem:capOf(sPS);
          const take=minF(rem,cap);
          if(take.n>0)addAsaba('psis',take,'a_muq');
          const left=rem.sub(take);
          if(left.n>0)addAsaba('gf',left,'a_leftover');
        }
      }
    }
  }else{
    if(sFB>0)share([['fbro',2],['fsis',1]],res,'a_mf');
    else if(femDesc&&sFS>0){claimed=true;if(res.n>0)addAsaba('fsis',res,'a_ghayr');else zeroW('fsis')}
    else if(pB>0)share([['pbro',2],['psis',1]],res,'a_mf');
    else if(femDesc&&pS>0){claimed=true;if(res.n>0)addAsaba('psis',res,'a_ghayr');else zeroW('psis')}
  }
  if(!claimed){
    const first=far.find(live);
    if(first){
      claimed=true;
      if(res.n>0)addAsaba(first,res,'a_self');else zeroW(first);
      far.forEach(k=>{if(k!==first)setBlock(k,{t:'b_closer'})});
    }
  }else far.forEach(k=>setBlock(k,{t:'b_closer'}));

  /* المجاميع والعول والرد */
  ORDER.forEach(k=>E[k].total=E[k].fard.add(E[k].asaba));
  let sum=ORDER.reduce((a,k)=>a.add(E[k].total),Z);
  let asl=1;ORDER.forEach(k=>{if(E[k].fard.n>0)asl=lcm(asl,E[k].fard.d)});
  const shares=ORDER.reduce((a,k)=>a+E[k].fard.n*(asl/E[k].fard.d),0);
  if(sum.cmp(ONE)>0){
    meta.awl=true;meta.asl=asl;meta.awlTo=shares;
    ORDER.forEach(k=>{E[k].total=E[k].total.div(sum)});
    note('n_awl',{a:asl,b:shares});
  }else if(sum.cmp(ONE)<0&&!claimed){
    const rem=ONE.sub(sum);
    const elig=ORDER.filter(k=>k!=='husband'&&k!=='wife'&&E[k].total.n>0);
    if(elig.length){
      const spouse=E.husband.total.add(E.wife.total);
      const target=ONE.sub(spouse);
      const se=elig.reduce((a,k)=>a.add(E[k].total),Z);
      elig.forEach(k=>{E[k].total=E[k].total.mul(target).div(se)});
      meta.radd=true;meta.asl=asl;
      note('n_radd');
    }else if(spouseF.n>0){
      if(o.raddSpouse){
        ORDER.forEach(k=>{if(E[k].total.n>0)E[k].total=E[k].total.div(sum)});
        meta.radd=true;note('n_radd_sp');
      }else{meta.rest=rem;note('n_bait')}
    }
  }
  return {E,meta};
}

const AVO={
  husband:{head:'ghutra',skin:SKIN.b,beard:'short',must:1},
  wife:{head:'hijab',hijab:'#b455d8',skin:SKIN.a},
  father:{head:'ghutra',skin:SKIN.c,beard:'short',must:1},

const CAP_PROPS=['display','position','top','right','bottom','left','width','height','min-width','max-width','min-height','box-sizing','margin-top','margin-right','margin-bottom','margin-left','padding-top','padding-right','padding-bottom','padding-left','border-top-width','border-right-width','border-bottom-width','border-left-width','border-top-style','border-right-style','border-bottom-style','border-left-style','border-top-color','border-right-color','border-bottom-color','border-left-color','border-top-left-radius','border-top-right-radius','border-bottom-left-radius','border-bottom-right-radius','background-color','background-image','background-size','background-position','color','font-family','font-size','font-weight','font-style','line-height','letter-spacing','text-align','text-decoration-line','text-overflow','white-space','overflow-x','overflow-y','direction','unicode-bidi','flex-direction','flex-wrap','flex-grow','flex-shrink','flex-basis','justify-content','align-items','align-self','row-gap','column-gap','grid-template-columns','grid-template-rows','opacity','box-shadow','list-style-type','list-style-position','vertical-align','word-break','overflow-wrap','fill','stroke','stroke-width','stroke-dasharray','stroke-dashoffset','stroke-linecap','stroke-linejoin','fill-opacity','stroke-opacity','filter','z-index','table-layout','border-collapse','border-spacing','text-shadow','text-anchor','background-clip','-webkit-background-clip','-webkit-text-fill-color'];
const CAP_SKIP=new Set(['none','normal','0px','auto','static','visible','rgba(0, 0, 0, 0)','0','row','stretch','nowrap','start','baseline','separate','0px 0px','repeat']);
function capInline(src,dst){
  const cs=getComputedStyle(src);let css='';
  for(const p of CAP_PROPS){const v=cs.getPropertyValue(p);if(v&&!CAP_SKIP.has(v))css+=p+':'+v+';'}
  if(cs.animationName&&cs.animationName!=='none')css+='animation:none;opacity:1;transform:none;';
  dst.setAttribute('style',css);
  const sc=src.children,dc=dst.children;
  for(let i=0;i<sc.length;i++)capInline(sc[i],dc[i]);
}
async function resultBlob(){
  const src=$('#resBody'),W=src.offsetWidth,H=src.scrollHeight;
  const clone=src.cloneNode(true);
  capInline(src,clone);
  $$('.actions',clone).forEach(e=>e.remove());
  const pad=16,bg=getComputedStyle(document.body).backgroundColor||'#f2f8f4';
  const wrap=document.createElement('div');
  wrap.setAttribute('xmlns','http://www.w3.org/1999/xhtml');
  wrap.setAttribute('style',`width:${W+pad*2}px;padding:${pad}px;box-sizing:border-box;background:${bg};direction:${document.documentElement.dir};font-family:Cairo,'Noto Sans Bengali',system-ui,Arial,sans-serif`);
  wrap.appendChild(clone);
  const outW=W+pad*2,outH=H+pad*2;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${outW}" height="${outH}"><foreignObject x="0" y="0" width="100%" height="100%">${new XMLSerializer().serializeToString(wrap)}</foreignObject></svg>`;
  const img=new Image();
  await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)});
  const scale=Math.min(2,12000/outH);
  const cv=document.createElement('canvas');cv.width=Math.round(outW*scale);cv.height=Math.round(outH*scale);
  const ctx=cv.getContext('2d');ctx.scale(scale,scale);ctx.fillStyle=bg;ctx.fillRect(0,0,outW,outH);ctx.drawImage(img,0,0);
  return await new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error('blob')),'image/png'));
}
async function copyAll(text){
  toast(t('img_wait'));
  try{
    if(!(navigator.clipboard&&window.ClipboardItem&&navigator.clipboard.write))throw new Error('noclip');
    await navigator.clipboard.write([new ClipboardItem({'text/plain':Promise.resolve(new Blob([text],{type:'text/plain'})),'image/png':resultBlob()})]);
    toast(t('img_ok'));
  }catch(e){copyText(text,'img_text')}
}

const IT={cash:{ic:'💰',n:'cash'},house:{ic:'🏠',n:'house'},land:{ic:'🌳',n:'land'},gold:{ic:'🪙',n:'gold'}};
const IMG={cash:cashImg,house:houseImg,land:landImg,gold:goldImg};
function collectItems(){

  if(cash>0)items.push({k:'cash',qty:cash,val:cash});

  if(hq>0)items.push({k:'house',qty:hq,val:num($('#houseVal').value)});
  const lq=on('onLand')?num($('#landArea').value):0;
  if(lq>0)items.push({k:'land',qty:lq,val:num($('#landVal').value)});
  const gq=on('onGold')?num($('#goldG').value):0;
  if(gq>0)items.push({k:'gold',qty:gq,val:gq*num($('#goldPrice').value),karat:$('#goldK').value});

const itLabel=it=>t(IT[it.k].n)+(it.k==='gold'&&it.karat?' '+it.karat+'K':'');
function qtxt(R,k,x){
  if(k==='cash')return `${fmt(x,R.dec)} ${R.cur}`;
  if(k==='gold')return `${nf(x,3)} ${t('u_g')}`;
  return `${nf(x,2)} ${t('u_m2')}`;
}
function updateSummary(){
  const cur=$('#cur').value,d=decOf(cur);

/* ============ الحساب ============ */
function calcCore(){
  const cur=$('#cur').value,dec=decOf(cur);store.set('mirath_cur',cur);
  const items=collectItems();
  if(!items.length){toast(t('e_assets'));goStep(1);return null}
  const debts=num($('#debts').value),funeral=num($('#funeral').value),D=debts+funeral;
  const valued=items.reduce((a,i)=>a+i.val,0);
  if(D>0&&valued<=0){toast(t('e_dv'));goStep(1);return null}
  if(D>0&&D>=valued){toast(t('e_dall'));return null}
  if(heirTotal()===0){toast(t('e_heirs'));goStep(2);return null}
  const debtF=valued>0?D/valued:0,netV=valued-D;
  const c={};Object.keys(AVO).forEach(k=>{c[k]=(ONLY[k]&&ONLY[k]!==S.sex)?0:(S.c[k]||0)});
  const out=compute(c,{hanafi:$('#optHanafi').checked,raddSpouse:$('#optRadd').checked});
  let reqFrac=0,exec=0,wasCap=false,wasOk=false;
  const wasOn=$('#wasOn').checked;
  if(wasOn){
    const v=num($('#wasVal').value);
    if($('#wasType').value==='pct')reqFrac=Math.min(v,100)/100;
    else{
      if(netV<=0&&v>0){toast(t('e_wv'));return null}
      reqFrac=netV>0?Math.min(v/netV,1):0;
    }
    const limit=1/3,consent=$('#wasConsent').checked;
    exec=consent?reqFrac:Math.min(reqFrac,limit);
    wasCap=reqFrac>limit+1e-9;wasOk=consent&&wasCap;
  }
  items.forEach(it=>{
    const keep=(it.val>0||it.k==='cash')?(1-debtF):1;
    it.net=it.qty*keep;it.was=it.net*exec;it.dist=it.net-it.was;
  });
  LAST={cur,dec,items,valued,D,netV,wasOn,reqFrac,exec,wasV:netV*exec,wasReqV:netV*reqFrac,wasCap,wasOk,wasTo:$('#wasTo').value.trim(),distV:netV*(1-exec),sex:S.sex,...out};
  return LAST;
}
function calculate(){
  const R=calcCore();if(!R)return;
  saveHistory(R);
  const ov=$('#overlay');ov.classList.remove('hidden');
  const msgs=['l1','l2','l3','l4'];let i=0;
  $('#loadMsg').textContent=t(msgs[0]);$('#loadBar').style.width='0';
  requestAnimationFrame(()=>requestAnimationFrame(()=>$('#loadBar').style.width='100%'));
  const iv=setInterval(()=>{i=Math.min(i+1,3);$('#loadMsg').textContent=t(msgs[i])},450);
  setTimeout(()=>{clearInterval(iv);ov.classList.add('hidden');renderResult(R);show('result');confetti()},1800);
}

/* ============ النتيجة ============ */
const PAL=['#14c299','#f5b72e','#ff6f8e','#4aa8ff','#a78bfa','#ff9d2e','#26a69a','#e5524f','#8bc34a','#00a6d6','#f06292','#7b61ff'];
const fracHTML=f=>f.d===1?`<span class="fr"><b>${f.n}</b></span>`:`<span class="fr"><b>${f.n}</b><b>${f.d}</b></span>`;
const pctStr=f=>(Math.round(f.num()*10000)/100).toString()+'%';
const pc2=x=>(Math.round(x*10000)/100)+'%';
const partsOf=(R,frac,div)=>R.items.map(it=>({k:it.k,v:it.dist*frac.n/frac.d/div}));
const partsHTML=(R,ps)=>`<ul class="parts">${ps.map(p=>`<li><span>${IT[p.k].ic}</span><b>${esc(qtxt(R,p.k,p.v))}</b></li>`).join('')}</ul>`;
const partsInline=(R,ps)=>ps.map(p=>`${IT[p.k].ic} ${qtxt(R,p.k,p.v)}`).join(' · ');
function rw(w){
  if(w.t==='blk')return t('blk',{x:w.x==='desc'?t('x_desc'):t('h_'+w.x)});
  const s=t(w.t,w.p);return w.f?`${w.f} — ${s}`:s;
}
function donut(parts,total,top,bot){
  let off=0;
  const segs=parts.map(p=>{
    const pc=p.v/total*100;
    const s=`<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${p.c}" stroke-width="7" pathLength="100" stroke-dasharray="${pc} ${100-pc}" stroke-dashoffset="${25-off}"/>`;
    off+=pc;return s;
  }).join('');
  return `<svg viewBox="0 0 42 42" role="img"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--line)" stroke-width="7"/>${segs}
  <text x="21" y="20" text-anchor="middle" font-size="3.2" font-weight="800" fill="var(--muted)" font-family="Cairo,sans-serif">${esc(top)}</text>
  <text x="21" y="25" text-anchor="middle" font-size="3.6" font-weight="900" fill="var(--ink)" font-family="Cairo,sans-serif">${esc(bot)}</text></svg>`;
}
function renderResult(R){
  const moneyT=x=>`${fmt(x,R.dec)} ${R.cur}`,money=x=>`<bdi>${esc(moneyT(x))}</bdi>`;
  const hasV=R.valued>0,showParts=!(R.items.length===1&&R.items[0].k==='cash');
  const keys=ORDER.filter(k=>R.E[k].count>0);
  const rows=keys.map(k=>{
    const e=R.E[k],zero=!!e.blocked||e.total.n===0;
    return {k,e,zero,label:t('h_'+k),ps:zero?[]:partsOf(R,e.total,1),per:zero?[]:partsOf(R,e.total,e.count),val:zero?0:R.distV*e.total.n/e.total.d};
  });
  const gets=rows.filter(r=>!r.zero),rest=R.meta.rest;
  const baitPs=rest.n>0?partsOf(R,rest,1):[],baitV=rest.n>0?R.distV*rest.n/rest.d:0;
  const wasPs=R.items.map(it=>({k:it.k,v:it.was})).filter(p=>p.v>0);
  const wasLbl=t('will_card')+(R.wasTo?` (${R.wasTo})`:'');
  const parts=[];
  if(hasV){
    gets.forEach((r,i)=>parts.push({l:r.label,v:r.val,c:PAL[i%PAL.length]}));
    if(baitV>0)parts.push({l:t('treasury'),v:baitV,c:'#9aa5a0'});
    if(R.wasV>0)parts.push({l:wasLbl,v:R.wasV,c:'#ffb703'});
    if(R.D>0)parts.push({l:t('r_debts'),v:R.D,c:'#e0484f'});
  }else{
    gets.forEach((r,i)=>parts.push({l:r.label,v:r.e.total.num()*(1-R.exec),c:PAL[i%PAL.length]}));
    if(rest.n>0)parts.push({l:t('treasury'),v:rest.num()*(1-R.exec),c:'#9aa5a0'});
    if(R.exec>0)parts.push({l:wasLbl,v:R.exec,c:'#ffb703'});
  }
  const tot=parts.reduce((a,p)=>a+p.v,0)||1;

  const notes=[...R.meta.notes];
  if(R.items.length>1)notes.push({t:'n_multi'});
  if(R.wasOn&&R.reqFrac>0){
    const mv=x=>R.netV>0?` (${moneyT(x)})`:'';
    if(R.wasOk)notes.push({t:'n_was_ok',p:{p:pc2(R.reqFrac)+mv(R.wasReqV)}});
    else if(R.wasCap)notes.push({t:'n_was_cap',p:{p:pc2(R.reqFrac),q:pc2(R.exec)+mv(R.wasV)}});
    else notes.push({t:'n_was_full',p:{p:pc2(R.exec)+mv(R.wasV)}});
    notes.push({t:'n_was_heir'});
  }
  if(R.D>0){notes.push({t:'n_order'});if(R.items.some(i=>i.val<=0&&i.k!=='cash'))notes.push({t:'n_unvalued'})}
  if(R.items.some(i=>i.k==='house'||i.k==='land'))notes.push({t:'n_real'});
  notes.push({t:'n_disc'});

  let h=`<div class="card banner"><div class="mascot">${mascot()}</div><h2>${t('r_t')}</h2><p>${t('r_dua_'+R.sex)}</p>
      <div class="gift l">${gift('#ff6f8e','#ff9db3')}</div><div class="gift r">${gift('#4aa8ff','#8cc8ff')}</div></div>`;
  h+=`<div class="astiles">${R.items.map(it=>`<div class="card at"><div class="aimg sm">${IMG[it.k]()}</div><small>${esc(itLabel(it))}</small><b>${esc(qtxt(R,it.k,it.qty))}</b></div>`).join('')}</div>`;
  if(hasV){
    h+=`<div class="tiles"><div class="card tile"><small>${t('r_val')}</small><b>${money(R.valued)}</b></div><div class="card tile"><small>${t('r_debts')}</small><b>${money(R.D)}</b></div><div class="card tile"><small>${t('r_will')}</small><b>${money(R.wasV)}</b></div><div class="card tile hl"><small>${t('r_net')}</small><b>${money(R.distV)}</b></div></div>`;
  }else if(R.exec>0){
    h+=`<div class="tiles"><div class="card tile"><small>${t('r_will')}</small><b>${pc2(R.exec)}</b></div></div>`;
  }
  h+=`<div class="card donut" style="margin-top:14px"><div>${donut(parts,tot,hasV?t('s2'):t('s3'),hasV?fmt(R.valued,0):'100%')}</div><ul class="legend">${parts.map(p=>`<li><i style="background:${p.c}"></i>${esc(p.l)}<em>${(p.v/tot*100).toFixed(1)}%</em></li>`).join('')}</ul></div>`;
  h+=`<h3 class="sec">🎁 ${t('r_heirs')}</h3><div class="rgrid">`;
  rows.forEach((r,i)=>{
    const e=r.e;
    h+=`<article class="rcard ${r.zero?'off':''}" style="animation-delay:${i*70}ms"><div class="rav">${av(r.k)}</div><div class="rb"><h4>${esc(r.label)}${e.count>1?`<span class="cnt">× ${e.count}</span>`:''}</h4>`;
    if(r.zero){
      h+=`<span class="zero">${t('no_inh')}</span><ul class="why"><li>${esc(e.blocked?rw(e.blocked):(e.why.length?rw(e.why[e.why.length-1]):t('no_inh')))}</li></ul>`;
    }else{
      h+=`<div class="rf">${fracHTML(e.total)}<span class="pct">${pctStr(e.total)}</span></div>`;
      if(hasV)h+=`<div class="amt">${money(r.val)}</div>`;

        if(showParts)h+=partsHTML(R,r.per);
      }
      h+=`<ul class="why">${e.why.map(w=>`<li>${esc(rw(w))}</li>`).join('')}</ul>`;
    }
    h+=`</div></article>`;
  });

  if(R.exec>0)h+=`<article class="rcard" style="border-color:var(--gold)"><div class="rav" style="font-size:3.4rem;text-align:center">📜</div><div class="rb"><h4>${esc(wasLbl)}</h4><div class="rf"><span class="pct">${pc2(R.exec)}</span></div>${hasV?`<div class="amt">${money(R.wasV)}</div>`:''}${showParts?partsHTML(R,wasPs):''}<ul class="why"><li>${t('will_note')}${hasV?` (${money(R.netV/3)})`:''}</li></ul></div></article>`;

  let base=1;gets.forEach(r=>base=lcm(base,r.e.total.d));if(rest.n>0)base=lcm(base,rest.d);
  const multi=hasV&&R.items.length>1;
  const cell=(ps,val)=>(multi?`<div><b>${money(val)}</b></div>`:'')+ps.map(p=>`<div>${IT[p.k].ic} ${esc(qtxt(R,p.k,p.v))}</div>`).join('');

  $('#aNew').onclick=resetAll;
}
function buildText(R,rows,baitV,moneyT){
  const L=[`${t('brand')} — ${t('cp_h')}`,'',t('cp_items')+':'];
  R.items.forEach(it=>L.push(`• ${itLabel(it)}: ${qtxt(R,it.k,it.qty)}`));
  if(R.D>0)L.push(`${t('r_debts')}: ${moneyT(R.D)}`);
  if(R.exec>0)L.push(`${t('will_card')}${R.wasTo?' ('+R.wasTo+')':''}: ${pc2(R.exec)}${R.netV>0?' ('+moneyT(R.wasV)+')':''}`);
  if(R.valued>0)L.push(`${t('r_net')}: ${moneyT(R.distV)}`);
  L.push('',t('cp_shares')+':');
  const multi=R.valued>0&&R.items.length>1;
  rows.forEach(r=>{
    if(r.zero)L.push(`• ${r.label}: ${t('no_inh')}`);
    else L.push(`• ${r.label}${r.e.count>1?' ×'+r.e.count:''}: ${r.e.total.toString()} = ${partsInline(R,r.ps)}${multi?' (≈ '+moneyT(r.val)+')':''}${r.e.count>1?' — '+t('each')+': '+partsInline(R,r.per):''}`);
  });
  if(baitV>0)L.push(`• ${t('treasury')}: ${moneyT(baitV)}`);
  L.push('',t('cp_foot'));
  return L.join('\n');
}
function copyText(x,msg){
  const done=()=>toast(t(msg||'copied'));
  const fb=()=>{const a=document.createElement('textarea');a.value=x;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){toast(t('copy_fail'))}a.remove()};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(x).then(done).catch(fb);else fb();
}
function resetAll(){
  S.c={};Object.keys(AVO).forEach(k=>setCount(k,0));
  ['estate','debts','funeral','wasVal','wasTo','houseArea','houseVal','landArea','landVal','goldG','goldPrice'].forEach(id=>$('#'+id).value='');
  [['onCash',true],['onHouse',false],['onLand',false],['onGold',false]].forEach(([id,v])=>{const cb=$('#'+id);cb.checked=v;cb.dispatchEvent(new Event('change'))});
  $('#wasOn').checked=false;$('#wasBox').classList.add('hidden');$('#wasConsent').checked=false;
  $('#estate').dispatchEvent(new Event('input'));
  S.step=1;show('wizard');paintStep();
}
function confetti(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const cv=$('#confetti'),ctx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  const cols=['#f5b72e','#14c299','#ff6f8e','#4aa8ff','#a78bfa','#ff9d2e'];
  const P=Array.from({length:150},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,w:6+Math.random()*7,h:8+Math.random()*10,c:cols[Math.random()*cols.length|0],vy:2+Math.random()*3.5,vx:-1.5+Math.random()*3,r:Math.random()*6,vr:-.2+Math.random()*.4}));
  let f=0;
  (function step(){
    ctx.clearRect(0,0,cv.width,cv.height);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()});
    if(++f<210)requestAnimationFrame(step);else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}
function toggleTheme(){
  const r=document.documentElement;
  const dark=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);
  const v=dark?'light':'dark';r.dataset.theme=v;store.set('mirath_theme',v);
}

/* ============ التهيئة ============ */
const LBADGE=['#14c299,#0e8f70','#4aa8ff,#2f6fe0','#ff6f8e,#e0485f','#f5b72e,#e08a1e','#a78bfa,#7b61ff','#26a69a,#00796b','#ff9d2e,#e5642e','#8bc34a,#4a9a2a','#00a6d6,#0b6fa6','#f06292,#c2185b','#7b61ff,#4a35c7','#e5524f,#b3261e','#14c299,#2f6fe0','#ffb703,#e0484f'];
const LEN={ar:'Arabic',en:'English',tr:'Turkish',ur:'Urdu',fa:'Persian',id:'Indonesian',ms:'Malay',bn:'Bengali',fr:'French',ru:'Russian',az:'Azerbaijani',uz:'Uzbek',sw:'Swahili',sq:'Albanian'};
function langCard(c,n,i,cls){
  const [c1,c2]=LBADGE[i%LBADGE.length].split(',');
  return `<button type="button" class="lcard ${cls||''}" data-l="${c}" style="--c1:${c1};--c2:${c2};animation-delay:${i*45}ms"><span class="lb">${c.toUpperCase()}</span><span><b>${n}</b><small>${LEN[c]}</small></span></button>`;
}
function startApp(l){
  applyLang(l);
  $('#langScreen').classList.add('hidden');$('#app').classList.remove('hidden');
  S.step=1;show('home');window.scrollTo(0,0);
}
function init(){
  const th=store.get('mirath_theme');if(th)document.documentElement.dataset.theme=th;
  $('#lsMascot').innerHTML=mascot();$('#loadMascot').innerHTML=mascot();
  $('#heroScene').innerHTML=heroScene();
  $('#heroMini').innerHTML=`<div style="display:flex;align-items:flex-end;justify-content:center">${['mother','daughter','son'].map(k=>`<div style="width:62px;margin:0 -6px">${av(k)}</div>`).join('')}</div>`;
  $('#decM').innerHTML=person(DEC.m);$('#decF').innerHTML=person(DEC.f);
  ['cash','house','land','gold'].forEach(k=>{$('#img-'+k).innerHTML=IMG[k]()});
  [['Cash','cash'],['House','house'],['Land','land'],['Gold','gold']].forEach(([n,k])=>{
    const cb=$('#on'+n),card=$('#as-'+k),sync=()=>card.classList.toggle('on',cb.checked);
    cb.addEventListener('change',sync);sync();
  });

  /* شاشة اختيار اللغة (أول ما يفتح التطبيق) */
  const nav=(navigator.language||'').slice(0,2).toLowerCase();
  $('#lsGrid').innerHTML=LANGS.map(([c,n],i)=>langCard(c,n,i,c===nav?'sug':'')).join('');
  $('#lsGrid').addEventListener('click',e=>{const b=e.target.closest('.lcard');if(b)startApp(b.dataset.l)});

  /* نافذة تغيير اللغة داخل التطبيق */
  document.addEventListener('click',e=>{
    if(e.target.closest('[data-act="lang"]')){
      $('#langGrid').innerHTML=LANGS.map(([c,n],i)=>langCard(c,n,i,c===S.lang?'on':'')).join('');
      $('#langSheet').classList.remove('hidden');return;
    }
    const lb=e.target.closest('#langGrid .lcard');
    if(lb){applyLang(lb.dataset.l);$('#langSheet').classList.add('hidden')}
  });
  $('#langX').onclick=()=>$('#langSheet').classList.add('hidden');
  $('#langSheet').addEventListener('click',e=>{if(e.target.id==='langSheet')e.target.classList.add('hidden')});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')$$('.modal').forEach(s=>s.classList.add('hidden'))});

  $('#btnHist').onclick=openHistSheet;
  $('#histX').onclick=closeHist;
  $('#histSheet').addEventListener('click',e=>{if(e.target.id==='histSheet')closeHist()});
  $('#histList').addEventListener('click',histClick);
  $('#histFoot').addEventListener('click',histClick);
  paintHistCount();
  $('#btnTheme').onclick=toggleTheme;
  $('#btnStart').onclick=()=>{S.step=1;show('wizard');paintStep()};
  $('#btnNext').onclick=nextStep;$('#btnBack').onclick=backStep;
  $$('.pk').forEach(p=>p.onclick=()=>{S.sex=p.dataset.sex;$$('.pk').forEach(x=>x.classList.toggle('on',x===p));applySex()});
  $('#estate').addEventListener('input',()=>{
    const v=num($('#estate').value),c=$('#cur').value;
    $('#estatePrev').textContent=v?`= ${fmt(v,decOf(c))} ${c}`:t('cash_hint');
  });
  $('#cur').addEventListener('change',()=>$('#estate').dispatchEvent(new Event('input')));
  $('#heirsWrap').addEventListener('click',e=>{
    const b=e.target.closest('button[data-a]');if(!b)return;
    const k=b.closest('.hc').dataset.k;setCount(k,(S.c[k]||0)+(b.dataset.a==='+'?1:-1));
  });
  $('#wasOn').addEventListener('change',()=>$('#wasBox').classList.toggle('hidden',!$('#wasOn').checked));

  /* إن كانت اللغة محفوظة يفتح التطبيق مباشرة، وإلا تظهر شاشة اللغة */
  const saved=store.get('mirath_lang');
  if(saved&&LANGS.some(x=>x[0]===saved))startApp(saved);
}
init();

</script>
